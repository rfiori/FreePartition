name: Release

# Runs when a version tag is pushed (for example v0.0.5 or v0.0.5-beta).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test FreePartition.slnx --configuration Release

  release:
    # A failing test blocks the release.
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $project = 'src/FreePartition.Wpf/FreePartition.Wpf.csproj'

          # Framework-dependent: small, needs the .NET Desktop Runtime installed.
          dotnet publish $project -c Release -r win-x64 --self-contained false `
            -p:Version=$version -o publish/fd
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # Self-contained: larger, runs without installing .NET.
          dotnet publish $project -c Release -r win-x64 --self-contained true `
            -p:Version=$version -o publish/sc
          if ($LASTEXITCODE -ne 0) { exit 1 }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path 'publish/fd/*' -DestinationPath "dist/FreePartition-$version-win-x64.zip"
          Compress-Archive -Path 'publish/sc/*' -DestinationPath "dist/FreePartition-$version-win-x64-self-contained.zip"

      - name: SHA-256 checksums
        shell: pwsh
        working-directory: dist
        run: |
          Get-ChildItem -Filter *.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Path SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $flags = @()
          if ($tag -match '-') { $flags += '--prerelease' }
          # A release for this tag may already exist (created by hand or by an earlier run): update it instead of failing.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/*.zip dist/SHA256SUMS.txt --clobber
          } else {
            gh release create $tag dist/*.zip dist/SHA256SUMS.txt `
              --title $tag --generate-notes @flags
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
